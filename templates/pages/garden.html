<div class="page" id="page-garden">
  <!-- Header, photos and beds are drawn by garden-page.js; the map below is moved between them. -->
  <div id="garden-root" aria-live="polite"></div>
  <div class="gdn-viewer-section" id="gdn-viewer-section">
    <div class="gdn-viewer-section-hd">
      <span class="gdn-viewer-section-title">The garden map</span>
      <span class="gdn-viewer-section-sub">Pan &amp; zoom to explore</span>
    </div>
    <div class="gdn-viewer-frame" id="gdn-viewer-frame">
      <canvas id="gdn-viewer-cv" class="gdn-viewer-cv"></canvas>
      <div class="gdn-viewer-tooltip" id="gdn-viewer-tooltip" style="display:none"></div>
      <div class="gdn-viewer-controls">
        <button class="gdn-viewer-ctrl" onclick="GDN.Viewer.zoom(1.2)" title="Zoom in">+</button>
        <button class="gdn-viewer-ctrl" onclick="GDN.Viewer.zoom(0.83)" title="Zoom out">&#8722;</button>
        <button class="gdn-viewer-ctrl" onclick="GDN.Viewer.resetView()" title="Reset">&#8855;</button>
      </div>
      <div class="gdn-viewer-resizer" id="gdn-viewer-resizer" title="Drag to resize">
        <div class="gdn-viewer-resizer-grip"></div>
      </div>
    </div>
  </div>
  <dialog class="gd-lightbox" id="gd-lightbox" aria-label="Photo"></dialog>
</div>
